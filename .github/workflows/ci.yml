# CI
#
# Design notes:
# - Checks out source with pinned official actions/checkout v4.2.2 (immutable SHA).
# - Provisions matrix Python with pinned official actions/setup-python v5.6.0 (immutable SHA).
# - Pins are SHAs on purpose; do not replace with mutable tags.
# - Tests are stub-only: local stub CLIs and temp dirs, no network, no live providers, no secrets.
# - `make ci` prints the Python version, byte-compiles scripts/, runs unittest discovery.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run repository gate
        run: |
          set -eu
          python3 --version
          make ci
