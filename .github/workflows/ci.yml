# CI
#
# Design notes:
# - Checks out source with pinned official actions/checkout v7.0.1 (immutable SHA).
# - Provisions matrix Python with pinned official actions/setup-python v7.0.0 (immutable SHA).
# - Pins are SHAs on purpose; do not replace with mutable tags.
# - Tests are stub-only: local stub CLIs and temp dirs, no network, no live providers, no secrets.
# - `make ci` prints the Python version, byte-compiles scripts/, runs unittest discovery.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run repository gate
        run: |
          set -eu
          python3 --version
          make ci
